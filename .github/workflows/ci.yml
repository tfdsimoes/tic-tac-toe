name: Java CI

on:
  push:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: Build and test (${{ matrix.os }}, Java ${{ matrix.java }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            java: '17'
            command: sh ./mvnw --batch-mode --no-transfer-progress verify
          - os: windows-latest
            java: '17'
            command: .\mvnw.cmd --batch-mode --no-transfer-progress verify
          - os: ubuntu-latest
            java: '21'
            command: sh ./mvnw --batch-mode --no-transfer-progress verify
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify project
        run: ${{ matrix.command }}

  dependency-review:
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
