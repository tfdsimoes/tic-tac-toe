name: Java CI

on:
  push:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: Build and test (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            command: sh ./mvnw --batch-mode --no-transfer-progress verify
          - os: windows-latest
            command: .\mvnw.cmd --batch-mode --no-transfer-progress verify
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify project
        run: ${{ matrix.command }}
